name: Validate card sorting
on:
  push:
    branches: [main, ux/recuperar-grupos]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: touch docs/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: card-sorting-pages
          path: docs/
          include-hidden-files: true
